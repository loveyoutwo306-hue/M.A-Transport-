<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M.A. Transport – Bill Book</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1ee;--card:#fff;--tx:#12301f;--gr:#176b3a;--ln:#9bb7a5;--mu:#5b6f62}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--card:#1b241e;--tx:#e6efe8;--gr:#2f9a5a;--ln:#4b6554;--mu:#9bb0a2}}
:root[data-theme="dark"]{--bg:#101712;--card:#1b241e;--tx:#e6efe8;--gr:#2f9a5a;--ln:#4b6554;--mu:#9bb0a2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px}
.wrap{max-width:560px;margin:0 auto}
.bill{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:0 1px 6px #0003}
.hd{background:#176b3a;color:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:10px;font-size:11px;line-height:1.35;align-items:center}
.hd .l b{font-size:15px;font-style:italic;display:block;margin-top:8px}
.hd .r{text-align:right}
.logo{background:#fff;color:#176b3a;border-radius:50%;padding:6px 14px;text-align:center;font-weight:900;font-size:24px;line-height:1}
.logo small{display:block;font-size:11px;letter-spacing:1px}
.addr{text-align:center;font-weight:700;font-size:13px;padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:8px 12px}
label{color:var(--gr);font-weight:700;font-size:14px;white-space:nowrap}
input,textarea{flex:1;min-width:0;border:0;border-bottom:1.5px dotted var(--ln);background:transparent;color:var(--tx);font:inherit;font-size:16px;padding:6px 2px;outline:0}
input:focus,textarea:focus{border-bottom-color:var(--gr)}
.col{display:block;padding:8px 12px}.col textarea{width:100%;min-height:52px;resize:vertical;margin-top:2px;border:1.5px dotted var(--ln);border-radius:4px;padding:6px}
.no{font-weight:700;font-size:20px;max-width:90px}
canvas{width:100%;height:110px;border:1.5px dashed var(--ln);border-radius:6px;touch-action:none;background:transparent;display:block;margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--gr);background:var(--gr);color:#fff;font-size:15px;font-weight:600}
button.o{background:transparent;color:var(--gr)}
h2{font-size:16px;margin:18px 0 6px}
.list .it{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.it small{color:var(--mu);display:block}
.it .a{display:flex;gap:6px}.it button{flex:none;padding:6px 10px;font-size:13px}
.tot{font-weight:700;padding:8px 2px}
@media print{body{background:#fff}.noprint{display:none!important}.bill{box-shadow:none}}
</style></head><body><div class="wrap">
<div class="bill" id="bill">
<div class="hd"><div class="l">PAN NO : AWTPK3164C<b>I.KABEER</b>Proprietor.</div>
<div class="logo">M.A.<small>TRANSPORT</small></div>
<div class="r">Kabeer – 94435 35405<br>89395 67669<br><i>I.Zameer</i><br>95660 10092<br>97865 38847</div></div>
<div class="addr">AMBUR – 635 802. Tpt. Dt.</div>
<div class="row"><label>No.</label><input id="no" class="no" inputmode="numeric"><label style="margin-left:auto">Date :</label><input id="date" type="date" style="max-width:150px"></div>
<div class="col"><label>From :</label><textarea id="from"></textarea></div>
<div class="col"><label>To :</label><textarea id="to"></textarea></div>
<div class="row"><label>G.P. No. / D.C. No.</label><input id="gp"></div>
<div class="row"><label>Rs.</label><input id="rs" inputmode="decimal"></div>
<div class="row"><label>No. of Qty.</label><input id="qty"></div>
<div class="col"><label>Checked by</label><canvas id="sig"></canvas>
<div class="noprint"><button class="o" id="clr" style="margin-top:6px;padding:6px;font-size:13px">கையொப்பம் அழி</button></div></div>
<div class="row"><label>Manager.</label><input id="mgr"></div>
</div>
<div class="btns noprint"><button id="save">சேமி</button><button class="o" id="new">புதிய பில்</button><button class="o" id="prt">Print / PDF</button></div>
<div class="noprint"><h2>மாத பில்கள்</h2>
<div class="row" style="padding:0 0 8px"><label>மாதம்</label><input type="month" id="mon"></div>
<div class="list" id="list"></div><div class="tot" id="tot"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const F=['no','date','from','to','gp','rs','qty','mgr'];
let bills=[];try{bills=JSON.parse(localStorage.getItem('mabills')||'[]')}catch(e){}
let sigData='',editing=null;
function persist(){try{localStorage.setItem('mabills',JSON.stringify(bills))}catch(e){}}
function nextNo(){return bills.length?Math.max(...bills.map(b=>+b.no||0))+1:3359}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const cv=$('sig'),cx=cv.getContext('2d');
function size(){const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;cx.scale(2,2);cx.lineWidth=2;cx.lineCap='round';cx.strokeStyle=getComputedStyle(document.body).color}
function drawImg(u){size();if(!u)return;const i=new Image();i.onload=()=>cx.drawImage(i,0,0,cv.width/2,cv.height/2);i.src=u}
let dr=false;
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{dr=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y)});
cv.addEventListener('pointermove',e=>{if(!dr)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(dr){dr=false;sigData=cv.toDataURL()}}));
$('clr').onclick=()=>{sigData='';size()};
function fill(b){F.forEach(k=>$(k).value=b[k]||'');sigData=b.sig||'';drawImg(sigData)}
function blank(){editing=null;fill({no:nextNo(),date:today()})}
$('new').onclick=blank;
$('save').onclick=()=>{
 const b={};F.forEach(k=>b[k]=$(k).value);b.sig=sigData;
 const i=bills.findIndex(x=>x.id===editing);
 if(i>=0){b.id=editing;bills[i]=b}else{b.id=Date.now();bills.push(b)}
 persist();$('mon').value=(b.date||today()).slice(0,7);render();blank();
};
$('prt').onclick=()=>window.print();
$('mon').value=today().slice(0,7);$('mon').onchange=render;
function render(){
 const m=$('mon').value,L=$('list');L.innerHTML='';let t=0;
 bills.filter(b=>(b.date||'').slice(0,7)===m).sort((a,b)=>(+a.no)-(+b.no)).forEach(b=>{
  t+=parseFloat(b.rs)||0;
  const d=document.createElement('div');d.className='it';
  const s=document.createElement('div');
  s.innerHTML='<b></b><small></small>';
  s.firstChild.textContent='No. '+b.no+' – Rs. '+(b.rs||'0');
  s.lastChild.textContent=b.date+' · '+(b.from||'')+' → '+(b.to||'');
  const a=document.createElement('div');a.className='a';
  const e=document.createElement('button');e.className='o';e.textContent='திருத்து';e.onclick=()=>{editing=b.id;fill(b);scrollTo(0,0)};
  const x=document.createElement('button');x.className='o';x.textContent='நீக்கு';x.onclick=()=>{if(confirm('நீக்கலாமா?')){bills=bills.filter(y=>y.id!==b.id);persist();render()}};
  a.append(e,x);d.append(s,a);L.append(d);
 });
 $('tot').textContent=L.children.length?'மொத்தம்: '+L.children.length+' பில்கள் · Rs. '+t.toLocaleString('en-IN'):'இந்த மாதம் பில் இல்லை';
}
addEventListener('load',()=>{blank();render()});
</script></body></html>
